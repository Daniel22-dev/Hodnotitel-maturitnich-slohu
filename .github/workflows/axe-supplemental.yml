name: Blocking axe-core audit

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify pinned axe and Playwright tool versions
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      - name: Run repository secret scan
        run: npm run qa:secrets
      - name: Verify fail-closed parallel bootstrap
        run: node --test tests/playwright-bootstrap-parallel.test.mjs
      - name: Install pinned Playwright Chromium (parallel OS and browser pilot)
        shell: bash
        run: |
          bash scripts/ci/install-playwright-chromium-parallel.sh
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Build application
        run: npm run build
      - name: Run blocking axe audit on executed UI
        run: npm run qa:axe
      - name: Upload axe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axe-p5-r2-${{ github.sha }}
          path: dist/qa-p5-axe-runtime-report.json
