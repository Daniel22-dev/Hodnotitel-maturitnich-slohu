name: GHRAB QA and deploy

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  qa-build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Run repository secret scan
        run: npm run qa:secrets
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run unified error reporter regression
        run: npm run test:reporter
      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghrab-qa-${{ github.sha }}
          path: qa-results
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform

      - name: Enforce P5 R2 release gate
        run: npm run qa:p5:ci

      - name: Verify protected deployment branch
        if: github.event_name == 'workflow_dispatch'
        run: npm run qa:github-governance
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Remove QA-only files from public Pages artifact
        if: github.event_name == 'workflow_dispatch'
        run: npm run prepare:pages

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'workflow_dispatch'
        with:
          path: dist
  deploy:
    permissions:
      pages: write
      id-token: write
    if: github.event_name == 'workflow_dispatch'
    needs: qa-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
