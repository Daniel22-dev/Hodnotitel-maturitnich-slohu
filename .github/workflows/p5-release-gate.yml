name: P5 R2 pre-production release gate

on:
  workflow_dispatch:
  push:
    branches: [candidate, main]
  pull_request:
    branches: [candidate, main]

permissions:
  contents: read

jobs:
  p5-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify evidence collector fail-closed behavior
        run: node --test tests/ci-evidence.test.mjs
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      - name: Run repository secret scan
        run: npm run qa:secrets
      # Core test suite includes security regressions and protected PDF structure.
      # Run before Chromium setup, but after pinned dependency/secret checks.
      - name: Run mandatory core regression suite before browser bootstrap
        run: npm test
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run P5 R2 + cumulative GARP 2.7 release gate
        run: npm run qa:p5:ci
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 794689a3da6a0dc74fef58ad5c1c7e87f03f1a472e77e0aa6aa4ab87e0321992
      # Build rewrites dist/, so preserve the checked P5 results *before* GARP foundation.
      - name: Validate and stage P5 certification evidence
        run: node scripts/ci/collect-certification-evidence.mjs p5
      - name: Upload required P5 certification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p5-r2-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ghrab-certification-p5/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce GARP 2.7 foundation admission and legacy regressions
        run: npm run qa:garp27:foundation
        env:
          GARP27_EXTERNAL_TRUST_SHA256: 794689a3da6a0dc74fef58ad5c1c7e87f03f1a472e77e0aa6aa4ab87e0321992
      - name: Validate and stage GARP 2.7 foundation evidence
        run: node scripts/ci/collect-certification-evidence.mjs foundation
      - name: Upload required GARP 2.7 foundation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: garp27-foundation-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ghrab-certification-foundation/
          if-no-files-found: error
          retention-days: 30
      - name: Validate final Pages release identity
        run: npm run prepare:pages
