name: Essay v2 verified groups draft QA (NO DEPLOY)
on:
  push:
    branches:
      - feature/essay-groups-v2-20261027

permissions:
  contents: read

jobs:
  essay-groups-v2-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build without deployment
        run: npm run build
      - name: Exact-source verified v2 groups and recipient holds
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check src/js/26-central-groups.js
          node --check tests/central-groups-regressions.mjs
          node --test tests/central-groups-regressions.mjs
